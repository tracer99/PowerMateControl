name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Tag pushes publish the GitHub Release. Main pushes only build artifacts for
    # untagged work. Skip main when this commit is a `release: vX.Y.Z` so
    # `git push origin main vX.Y.Z` does not run the same Windows build twice.
    if: >
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' &&
       !startsWith(github.event.head_commit.message, 'release:'))
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: pwsh
        run: |
          . .\scripts\Get-ProjectVersion.ps1
          $v = Get-ProjectVersion
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VERSION=$v"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          . .\scripts\Get-ProjectVersion.ps1
          $v = Get-ProjectVersion
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$v") {
            throw "Tag '$tag' must match VERSION file (expected 'v$v'). Update VERSION/CHANGELOG and retag."
          }
          Test-ChangelogHasVersion $v
          $notes = Get-ChangelogSection $v
          $repo = "${{ github.repository }}"
          @(
            "## What's new in v$v"
            ""
            $notes
            ""
            "**Full changelog:** https://github.com/$repo/blob/v$v/CHANGELOG.md"
          ) -join "`n" | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "--- release notes ---"
          Get-Content release-notes.md

      # Composite action (no Node runtime). Replaces ilammy/msvc-dev-cmd@v1 (Node 20).
      - name: Setup MSVC x64
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Build x64
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration Release -Architecture x64

      - name: Setup MSVC ARM64
        uses: egor-tensin/vs-shell@v2
        with:
          arch: amd64_arm64

      - name: Build ARM64
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration Release -Architecture ARM64

      # VS may spawn vctip.exe; stop it so the runner does not warn about orphan processes.
      - name: Stop MSVC tip process
        if: always()
        shell: pwsh
        run: Get-Process -Name vctip -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          foreach ($arch in @("x64", "arm64")) {
            $exe = ".\build\$arch\PowerMateControl.exe"
            $zip = "PowerMateControl-$v-windows-$arch.zip"
            Compress-Archive -Path $exe -DestinationPath .\$zip -Force
          }
          Get-Item .\build\x64\PowerMateControl.exe, .\build\arm64\PowerMateControl.exe, .\PowerMateControl-$v-windows-*.zip | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: PowerMateControl-${{ steps.version.outputs.version }}-windows
          path: |
            build/x64/PowerMateControl.exe
            build/arm64/PowerMateControl.exe
            PowerMateControl-${{ steps.version.outputs.version }}-windows-x64.zip
            PowerMateControl-${{ steps.version.outputs.version }}-windows-arm64.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: PowerMateControl ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            PowerMateControl-${{ steps.version.outputs.version }}-windows-x64.zip
            PowerMateControl-${{ steps.version.outputs.version }}-windows-arm64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
