name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Tag pushes publish the GitHub Release. Main pushes only build artifacts for
    # untagged work. Skip main when this commit is a `release: vX.Y.Z` so
    # `git push origin main vX.Y.Z` does not run the same Windows build twice.
    if: >
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' &&
       !startsWith(github.event.head_commit.message, 'release:'))
    runs-on: windows-latest

    # One VS developer shell per job: the shell is entered per step, and a single
    # job cannot host two architectures.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vs_arch: amd64
          - arch: arm64
            vs_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: pwsh
        run: |
          . .\scripts\Get-ProjectVersion.ps1
          $v = Get-ProjectVersion
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VERSION=$v"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          . .\scripts\Get-ProjectVersion.ps1
          $v = Get-ProjectVersion
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$v") {
            throw "Tag '$tag' must match VERSION file (expected 'v$v'). Update VERSION/CHANGELOG and retag."
          }
          Test-ChangelogHasVersion $v

      # The dev shell is entered in-process rather than through an action, because
      # HostArch must be amd64: the runner only ships the x64-hosted ARM64 cross
      # toolset, and VsDevCmd defaults its host to x86.
      - name: Build ${{ matrix.arch }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "No Visual Studio installation found" }
          $launch = Join-Path $vsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          & $launch -Arch ${{ matrix.vs_arch }} -HostArch amd64 -SkipAutomaticLocation
          .\scripts\build.ps1 -Configuration Release -Architecture ${{ matrix.arch }}

      # VS may spawn vctip.exe; stop it so the runner does not warn about orphan processes.
      - name: Stop MSVC tip process
        if: always()
        shell: pwsh
        run: Get-Process -Name vctip -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          $exe = ".\build\$arch\PowerMateControl.exe"
          $zip = "PowerMateControl-$v-windows-$arch.zip"
          Compress-Archive -Path $exe -DestinationPath .\$zip -Force
          Get-Item $exe, .\$zip | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: PowerMateControl-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}
          path: |
            build/${{ matrix.arch }}/PowerMateControl.exe
            PowerMateControl-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build release notes
        id: version
        shell: pwsh
        run: |
          # Forward slashes: this job runs pwsh on Linux.
          . ./scripts/Get-ProjectVersion.ps1
          $v = Get-ProjectVersion
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes = Get-ChangelogSection $v
          $repo = "${{ github.repository }}"
          @(
            "## What's new in v$v"
            ""
            $notes
            ""
            "**Full changelog:** https://github.com/$repo/blob/v$v/CHANGELOG.md"
          ) -join "`n" | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "--- release notes ---"
          Get-Content release-notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: PowerMateControl-*-windows-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: PowerMateControl ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            PowerMateControl-${{ steps.version.outputs.version }}-windows-x64.zip
            PowerMateControl-${{ steps.version.outputs.version }}-windows-arm64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
