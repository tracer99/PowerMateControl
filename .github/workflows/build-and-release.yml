name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          . .\scripts\Get-ProjectVersion.ps1
          $v = Get-ProjectVersion
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VERSION=$v"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          . .\scripts\Get-ProjectVersion.ps1
          $v = Get-ProjectVersion
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$v") {
            throw "Tag '$tag' must match VERSION file (expected 'v$v'). Update VERSION/CHANGELOG and retag."
          }
          Test-ChangelogHasVersion $v
          $notes = Get-ChangelogSection $v
          $repo = "${{ github.repository }}"
          @(
            "## What's new in v$v"
            ""
            $notes
            ""
            "**Full changelog:** https://github.com/$repo/blob/v$v/CHANGELOG.md"
          ) -join "`n" | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "--- release notes ---"
          Get-Content release-notes.md

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration Release

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $zip = "PowerMateControl-$v-windows-x64.zip"
          Compress-Archive -Path .\build\PowerMateControl.exe -DestinationPath .\$zip -Force
          Get-Item .\build\PowerMateControl.exe, .\$zip | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerMateControl-${{ steps.version.outputs.version }}-windows-x64
          path: |
            build/PowerMateControl.exe
            PowerMateControl-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PowerMateControl ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: PowerMateControl-${{ steps.version.outputs.version }}-windows-x64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
